<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="heading">Rock, Paper, Scissors</p>
    <div id="choices">
        <p>Choose Rock, Paper, or Scissors: <input type="text" id="human-choice"></p>
        <p><button id="computer-choice" onclick="getComputerChoice()">Computer Choice</button></p>     
    </div>

    <div id="results">
        <p id="round-result"></p>
        <p id="final-score"></p>
    </div>

    <div id="buttons">
        <button id="play-button" onclick="playGame()">Play Game</button>
        <button id="new-game" onclick="newGame()">New Game</button>
    </div>
</body>
</html>
